name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  complexity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cognitive complexity
        # cccc.toml sets the limit. The archive is checked against the build
        # provenance of moznion/cccc's release workflow before it runs.
        env:
          GH_TOKEN: ${{ github.token }}
          CCCC_VERSION: v1.8.3
        run: |
          asset="cccc-$CCCC_VERSION-x86_64-unknown-linux-musl.tar.gz"
          gh release download "$CCCC_VERSION" --repo moznion/cccc --pattern "$asset" --dir "$RUNNER_TEMP"
          gh attestation verify "$RUNNER_TEMP/$asset" --repo moznion/cccc \
            --signer-workflow moznion/cccc/.github/workflows/release-build.yml
          mkdir "$RUNNER_TEMP/cccc"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/cccc"
          "$(find "$RUNNER_TEMP/cccc" -type f -name cccc | head -n 1)" . --table --top-cognitive 10

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install lychee
        # The release archive is checked against the SHA-256 recorded here
        # before it runs. To update: change both lines from the release's
        # .sha256 asset (https://github.com/lycheeverse/lychee/releases).
        env:
          LYCHEE_VERSION: lychee-v0.24.2
          LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
        run: |
          asset="lychee-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$asset" "https://github.com/lycheeverse/lychee/releases/download/$LYCHEE_VERSION/$asset"
          echo "$LYCHEE_SHA256  $RUNNER_TEMP/$asset" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lychee-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"

      - name: Link check script
        run: bash scripts/test-check-links.sh

      - name: Links in Markdown
        # Links to files in the repository and their #fragments; web links
        # are not checked (lychee.toml).
        run: bash scripts/check-links.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/pnpm-lock.yaml

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - run: pnpm install --frozen-lockfile

      - name: Release PR version script
        run: bash scripts/test-release-pr-version.sh

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Self-host deployment checks
        run: |
          pnpm run test:deploy

      - name: Standalone server deployment
        run: |
          rsync -a --exclude=node_modules --exclude=dist --exclude=.wrangler packages/ "$RUNNER_TEMP/pedit-server/"
          pnpm --dir "$RUNNER_TEMP/pedit-server" install --frozen-lockfile
          pnpm --dir "$RUNNER_TEMP/pedit-server" typecheck
          pnpm --dir "$RUNNER_TEMP/pedit-server" run test:deploy
          pnpm --dir "$RUNNER_TEMP/pedit-server" run deploy --dry-run

      - name: Go format
        run: test -z "$(gofmt -l cmd internal)" || (gofmt -l cmd internal && exit 1)

      - name: Go vet
        run: go vet ./...

      - name: Go vulnerabilities
        # A vulnerability the code can reach fails the build. JS dependencies are
        # watched by Dependabot alerts and security updates instead of pnpm audit,
        # which queries importer names and reports vercel/serve advisories against
        # our workspace package "serve".
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Go test
        # PEDIT_INTEROP makes the interop test fail rather than skip without Node.js deps.
        run: PEDIT_INTEROP=1 go test -race ./...

      # Keep the GoReleaser version and action SHA the same as in
      # release-build.yml, so this build is the one a release gets.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          install-only: true

      - name: Build and verify CLI release archives
        # A local tag lets GoReleaser validate as it does for a release: the
        # tag points at HEAD and the tree is clean.
        run: |
          git tag v0.0.0-test
          goreleaser release --clean --skip=publish
          mkdir -p "$RUNNER_TEMP/pedit-release"
          cp dist/pedit_*.tar.gz dist/pedit_*.zip dist/checksums.txt "$RUNNER_TEMP/pedit-release/"
          cd "$RUNNER_TEMP/pedit-release"
          sha256sum --check checksums.txt
          test "$(wc -l < checksums.txt)" -eq 6
          tar -xzf pedit_v0.0.0-test_linux_amd64.tar.gz
          test "$(./pedit --version)" = v0.0.0-test
          unzip -l pedit_v0.0.0-test_windows_arm64.zip | grep -q pedit.exe

      - name: CLI release archives are reproducible
        # A second build (new dist/, another umask and time zone) must give
        # the same bytes, so a release can be rebuilt and compared.
        run: |
          (umask 077 && TZ=Asia/Tokyo goreleaser release --clean --skip=publish)
          diff "$RUNNER_TEMP/pedit-release/checksums.txt" dist/checksums.txt

      - name: Install script
        run: bash scripts/test-install.sh v0.0.0-test "$RUNNER_TEMP/pedit-release"

      - name: Upload CLI release archives (for the Windows install test)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pedit-release
          path: ${{ runner.temp }}/pedit-release
          retention-days: 1
          if-no-files-found: error

  install-windows:
    # install.ps1 against the archives the test job built, in Windows PowerShell
    # and in PowerShell 7. The test edits the user PATH of this throwaway runner
    # and puts it back.
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pedit-release
          path: ${{ runner.temp }}/pedit-release

      - name: Install script (Windows PowerShell 5.1)
        shell: powershell
        run: .\scripts\test-install.ps1 v0.0.0-test "$env:RUNNER_TEMP\pedit-release"

      - name: Install script (PowerShell 7)
        shell: pwsh
        run: .\scripts\test-install.ps1 v0.0.0-test "$env:RUNNER_TEMP\pedit-release"

  go-macos:
    # Saving swaps files with renameatx_np on macOS, which ubuntu cannot run.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Go test (file writes)
        run: go test -race ./internal/filewriter/

  go-windows:
    # pedit checks who owns a configuration file or a serve state by SID, and
    # replaces files around Windows' sharing rules, which ubuntu cannot run.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Go test (serve, file writes)
        run: go test ./internal/serve/ ./internal/filewriter/

      - name: Go test (configuration ownership, serve command, self-update)
        # Most of cmd/pedit's other tests assume Unix (read-only directories, path separators).
        run: go test -run "Config|Owner|SID|KeepWindows|Serve|SelfUpdate|SelfUpgrade|ReplaceFile" ./cmd/pedit/

  serve-windows:
    # @pedit/serve on Windows: the fake pedits are Node scripts, the real one is built by the tests.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/pnpm-lock.yaml

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - run: pnpm install --frozen-lockfile

      - name: Test (@pedit/serve)
        run: pnpm --dir packages --filter @pedit/serve test
