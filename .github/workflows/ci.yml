name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/pnpm-lock.yaml

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Self-host deployment checks
        run: |
          pnpm run test:deploy

      - name: Standalone server deployment
        run: |
          rsync -a --exclude=node_modules --exclude=dist --exclude=.wrangler packages/ "$RUNNER_TEMP/pedit-server/"
          pnpm --dir "$RUNNER_TEMP/pedit-server" install --frozen-lockfile
          pnpm --dir "$RUNNER_TEMP/pedit-server" typecheck
          pnpm --dir "$RUNNER_TEMP/pedit-server" run test:deploy
          pnpm --dir "$RUNNER_TEMP/pedit-server" run deploy --dry-run

      - name: Go format
        run: test -z "$(gofmt -l cmd internal)" || (gofmt -l cmd internal && exit 1)

      - name: Go vet
        run: go vet ./...

      - name: Go test
        # PEDIT_INTEROP makes the interop test fail rather than skip without Node.js deps.
        run: PEDIT_INTEROP=1 go test -race ./...

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          install-only: true

      - name: Build and verify CLI release archives
        # The checkout has no tag, so GORELEASER_CURRENT_TAG names one and
        # validation (tag at HEAD, clean tree) is skipped.
        env:
          GORELEASER_CURRENT_TAG: v0.0.0-test
        run: |
          goreleaser release --clean --skip=publish,validate
          mkdir -p "$RUNNER_TEMP/pedit-release"
          cp dist/pedit_*.tar.gz dist/pedit_*.zip dist/checksums.txt "$RUNNER_TEMP/pedit-release/"
          cd "$RUNNER_TEMP/pedit-release"
          sha256sum --check checksums.txt
          test "$(wc -l < checksums.txt)" -eq 6
          tar -xzf pedit_v0.0.0-test_linux_amd64.tar.gz
          test "$(./pedit --version)" = v0.0.0-test
          unzip -l pedit_v0.0.0-test_windows_arm64.zip | grep -q pedit.exe

      - name: CLI release archives are reproducible
        # A second build (new dist/, another umask and time zone) must give
        # the same bytes, so a release can be rebuilt and compared.
        env:
          GORELEASER_CURRENT_TAG: v0.0.0-test
        run: |
          (umask 077 && TZ=Asia/Tokyo goreleaser release --clean --skip=publish,validate)
          diff "$RUNNER_TEMP/pedit-release/checksums.txt" dist/checksums.txt

      - name: Install script
        run: bash scripts/test-install.sh v0.0.0-test "$RUNNER_TEMP/pedit-release"

  go-macos:
    # Saving swaps files with renameatx_np on macOS, which ubuntu cannot run.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Go test (file writes)
        run: go test -race ./internal/filewriter/

  go-windows:
    # pedit checks who owns a configuration file by SID on Windows, which ubuntu cannot run.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Go test (configuration ownership)
        run: go test -run "Config|Owner|SID" ./cmd/pedit
