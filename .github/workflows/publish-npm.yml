name: publish-npm

# Publishes @pedit/serve and @pedit/review to npm with the version of a pedit
# release: the packages follow the CLI's version, one number for all
# (docs/contributing/deployment.md "npm package"). tagpr.yml calls this after
# the CLI archives were built and attached to the Release, so a release whose
# build failed publishes nothing. It is a reusable workflow, not a `release`
# trigger: a Release published with GITHUB_TOKEN starts no other workflow.
#
# Authentication is npm's trusted publishing: the job presents a GitHub OIDC
# token (id-token: write, in the caller too) and npm checks it against the
# trusted publisher configured for the package. npm validates the calling
# workflow's file name, so the trusted publisher names tagpr.yml, not this
# file. No token is stored. The publish carries provenance, which npm shows on
# the package page and `npm audit signatures` verifies.

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
        description: Release tag to publish (e.g. v0.4.0)

permissions:
  contents: read

jobs:
  publish:
    name: Publish @pedit/${{ matrix.package }}
    strategy:
      # One package failing (e.g. its trusted publisher not set up yet) does
      # not stop the other.
      fail-fast: false
      matrix:
        package: [serve, review]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check the tag
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "not a release tag: $TAG"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
        working-directory: packages
      # Before the build: @pedit/review's bundle carries its package version in
      # a banner and in PeditReview.version.
      - name: Set the package version to the release
        working-directory: packages/${{ matrix.package }}
        run: npm version "${TAG#v}" --no-git-tag-version
      - run: pnpm --filter "@pedit/${{ matrix.package }}" build
        working-directory: packages
      - name: Publish
        working-directory: packages/${{ matrix.package }}
        run: npm publish --provenance --access public
