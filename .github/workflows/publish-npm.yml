name: publish-npm

# Publishes @pedit/serve to npm with the version of the pedit release that
# tagpr.yml just completed: the package follows the CLI's version, one number
# for both (docs/contributing/deployment.md "npm package"). It runs once a
# Release is published, which tagpr.yml does only after the CLI archives were
# built and attached, so a release whose build failed publishes nothing.
#
# Authentication is npm's trusted publishing: the job presents a GitHub OIDC
# token (id-token: write) and npm checks it against the trusted publisher
# configured for the package (this repository and this workflow file). No
# token is stored. The publish carries provenance, which npm shows on the
# package page and `npm audit signatures` verifies.

on:
  release:
    types: [published]
  # A retry for a release whose publish failed; the tag must already exist.
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
        description: Release tag to publish (e.g. v0.4.0)

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Check the tag
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "not a release tag: $TAG"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
        working-directory: packages
      - run: pnpm --filter @pedit/serve build
        working-directory: packages
      - name: Set the package version to the release
        working-directory: packages/serve
        run: npm version "${TAG#v}" --no-git-tag-version
      - name: Publish
        working-directory: packages/serve
        run: npm publish --provenance --access public
