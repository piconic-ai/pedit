name: release-build

# Builds the CLI release archives for a tag and signs their build provenance.
# tagpr.yml calls this once tagpr has tagged; publishing the archives to the
# Release is left to the caller.
#
# The build lives in its own reusable workflow so that the provenance names
# this file as the signer: `gh attestation verify --signer-workflow
# piconic-ai/pedit/.github/workflows/release-build.yml` then proves an archive
# came out of these steps alone, run from the tag. The job gets no write access
# to the repository (contents: read); the archives leave it only as a workflow
# artifact, which the caller uploads to the Release.
#
# The input is only the tag, and the environment is pinned (runner image,
# Go version from go.mod, GoReleaser version, action SHAs), so .goreleaser.yaml
# gives the same bytes when the tag is rebuilt here.

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
        description: Release tag to build (e.g. v0.1.0)

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # Build provenance: id-token signs it through Sigstore, attestations and
      # artifact-metadata store it on GitHub for `gh attestation verify`.
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # GoReleaser only builds: publishing is skipped, the Release is
      # tagpr.yml's job. Left alone it takes the highest tag at HEAD, so
      # another tag on the same commit would name and stamp the archives;
      # GORELEASER_CURRENT_TAG pins the build to the requested tag, and
      # validation still checks that it points at HEAD and the tree is clean.
      - name: Build release archives and checksums
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        env:
          GORELEASER_CURRENT_TAG: ${{ inputs.tag }}
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean --skip=publish
      # dist/ also holds the per-target binaries and GoReleaser's metadata;
      # the release files are only the archives and checksums.txt.
      - name: Collect the release files
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pedit-release"
          mkdir -p "$out"
          cp dist/pedit_*.tar.gz dist/pedit_*.zip dist/checksums.txt "$out/"
      - name: Attest build provenance of the archives
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/pedit-release/pedit_*
      # The same provenance, as Release files, so it can be checked without the
      # GitHub API (gh attestation verify <archive> --bundle <file>). Both files
      # hold the whole Sigstore bundle, certificate and transparency-log entry
      # included, on one line: .sigstore.json and .intoto.jsonl are the names
      # tools look for a signature and for provenance under. The names carry no
      # OS or architecture, so installers that pick an archive by platform pass
      # them over; checksums.txt still lists only archives.
      - name: Add the provenance to the release files
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pedit-release"
          jq -ce 'select(.dsseEnvelope and .verificationMaterial)' "$BUNDLE" >"$out/pedit_${TAG}.sigstore.json"
          cp "$out/pedit_${TAG}.sigstore.json" "$out/pedit_${TAG}.intoto.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pedit-release
          path: ${{ runner.temp }}/pedit-release/
          if-no-files-found: error
          retention-days: 1
