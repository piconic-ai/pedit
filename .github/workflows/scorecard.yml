name: Scorecard

# OpenSSF Scorecard (https://scorecard.dev) rates the repository's supply-chain
# practices. The results go to the Security tab and, published, to the badge in
# the README. Scorecard limits what this workflow may contain (no workflow-level
# write permissions or env, only approved actions in the job): see
# https://github.com/ossf/scorecard-action#workflow-restrictions.

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      # Upload the results to the Security tab.
      security-events: write
      # Publish the results for the badge (GitHub OIDC).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
