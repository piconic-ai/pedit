name: tagpr

# Every push to main makes tagpr open (or update) a release PR that updates
# CHANGELOG.md. There is no version file to bump (.tagpr: versionFile = -): the
# CLI takes its version from the tag. Merging that PR creates the tag.
#
# Deploys are done by Cloudflare Workers Builds (Cloudflare's Git integration,
# Production branch = release). Workers Builds only has push triggers and cannot
# deploy on tags alone, so this workflow moves the release branch through the
# GitHub API (GITHUB_TOKEN) only when a tag was created. Ordinary pushes to main
# (which only refresh the release PR) create no tag, so release stays put and
# nothing is deployed.
#
# The branch is advanced with the GitHub API (PATCH .../git/refs/heads/release,
# force=false) rather than git push: there is no checkout at all and the server
# decides whether it is a fast-forward. A shallow clone missing older commits
# cannot cause a spurious "fetch first" rejection, a non-fast-forward is still
# refused thanks to force=false, and the job does not grow heavier as the
# history does (no fetch-depth: 0 for this step).

on:
  push:
    branches: ["main"]

# Read-only by default; each job asks for the writes it needs.
permissions:
  contents: read

concurrency:
  group: release-tagpr
  cancel-in-progress: false

jobs:
  tagpr:
    runs-on: ubuntu-latest
    # Pushes the release PR branch and the tag, opens and labels the release PR.
    permissions:
      contents: write
      pull-requests: write
      issues: read
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: tagpr
        uses: Songmu/tagpr@e1250d6c84e4425db82b5e90549d62dfe23e9ebe # v1.21.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Built and attested in release-build.yml, which has no write access; this
  # job only attaches what it built to the draft Release and publishes it.
  build-cli:
    name: Build pedit binaries
    needs: tagpr
    if: needs.tagpr.outputs.tag != ''
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ needs.tagpr.outputs.tag }}

  release-cli:
    name: Release pedit binaries
    needs: [tagpr, build-cli]
    if: needs.tagpr.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.tagpr.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pedit-release
          path: ${{ runner.temp }}/pedit-release
      - name: Attach binaries to the tagpr release
        run: gh release upload "$TAG" "$RUNNER_TEMP"/pedit-release/* --clobber
      - name: Publish the completed release
        run: gh release edit "$TAG" --draft=false

  update-homebrew-formula:
    needs: [tagpr, release-cli]
    if: needs.tagpr.outputs.tag != ''
    permissions:
      contents: read
    uses: ./.github/workflows/homebrew-formula.yml
    secrets: inherit
    with:
      tag: ${{ needs.tagpr.outputs.tag }}

  advance-release-branch:
    name: Advance release branch
    needs: tagpr
    if: needs.tagpr.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.tagpr.outputs.tag }}
    steps:
      - name: Advance release to this tag (fast-forward only, no checkout needed)
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/release" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/release" \
              -f sha="$sha" -F force=false
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref=refs/heads/release -f sha="$sha"
          fi
